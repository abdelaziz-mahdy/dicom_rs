[package]
name = "dicom_rs"
version = "0.2.0"
edition = "2021"
description = "Rust backend of the dicom_rs Flutter package"
license = "MIT"
repository = "https://github.com/abdelaziz-mahdy/dicom_rs"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
dicom = "0.10.1"
anyhow = "1.0"
dicom-pixeldata = { version = "0.10", features = ["image"] }

[lints.rust]
# Set by flutter_rust_bridge macros.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

# Proc-macros are dylibs that rustc loads while compiling. Xcode 27's `strip`
# writes a mis-aligned LINKEDIT string pool into dylibs that use chained fixups
# (any MACOSX_DEPLOYMENT_TARGET >= 12.0, which Flutter's macOS build sets), so
# dyld refuses to load them and rustc reports "can't find crate for `paste`".
# Not stripping build-time artifacts avoids it; the shipped library is unaffected.
[profile.release.build-override]
strip = false
