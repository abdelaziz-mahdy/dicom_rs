name: Release

# Pushing a v* tag (for example v0.2.0) builds the example viewer app for
# every platform and attaches the builds to a GitHub release for that tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (for example v0.2.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dicom-viewer-${TAG}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dicom-viewer-*-android.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build macOS app
        working-directory: example
        run: |
          flutter pub get
          flutter build macos --release
          ditto -c -k --keepParent build/macos/Build/Products/Release/dicom_rs_example.app \
            "$GITHUB_WORKSPACE/dicom-viewer-${TAG}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dicom-viewer-*-macos.zip

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows app
        working-directory: example
        run: |
          flutter pub get
          flutter build windows --release
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path example/build/windows/x64/runner/Release/* `
            -DestinationPath "dicom-viewer-$env:TAG-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dicom-viewer-*-windows.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux app
        working-directory: example
        run: |
          flutter pub get
          flutter build linux --release
          tar -czf "$GITHUB_WORKSPACE/dicom-viewer-${TAG}-linux-x64.tar.gz" \
            -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dicom-viewer-*-linux-x64.tar.gz

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build web app
        run: |
          cd example
          flutter pub get
          dart run dicom_rs:build_web
          flutter build web --release
          cd build
          zip -r "$GITHUB_WORKSPACE/dicom-viewer-${TAG}-web.zip" web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dicom-viewer-*-web.zip

  release:
    needs: [android, macos, windows, linux, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "${TAG#v}" --generate-notes
          fi
